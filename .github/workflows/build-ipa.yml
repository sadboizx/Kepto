name: Build IPA (unsigned)

# Build Kepto thành .ipa KHÔNG ký (unsigned) bằng runner macOS của GitHub.
# File .ipa này chưa cài trực tiếp được — tải về rồi ký bằng cert của bạn
# trong Feather (giống Muse Clone) để cài lên iOS 17.4.
#
# Cách chạy: tab Actions → "Build IPA (unsigned)" → Run workflow,
# hoặc push code trong ios-app/** (tự build). Không dùng App Store.
#
# Kết quả: artifact Kepto-unsigned.ipa, giữ 30 ngày.

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15 # macos-14 đã bị GitHub khai tử 2026-11-02; macos-15 có Xcode 16, vẫn build được target iOS 17.4
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project ios-app/Kepto.xcodeproj \
            -scheme Kepto \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products -name 'Kepto.app' -type d | head -n 1)"
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Kepto-unsigned.ipa Payload
          ls -lh Kepto-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kepto-unsigned
          path: Kepto-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
