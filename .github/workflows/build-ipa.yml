name: Build IPA (unsigned)

# Build Kepto thành .ipa, ký bằng cert trong repo (signer/certificate/),
# rồi đẩy IPA đã ký lên R2 và trả link tải. Không qua Signed releases.
# Không PPQ Protection: bundle id giữ nguyên com.sadboizx.kepto (signer
# giữ id gốc của app, không đổi sang id của profile). Lưu ý: với profile
# explicit và không PPQ, Share Extension (PlugIns) sẽ bị bỏ.
#
# Cách chạy: tab Actions → "Build IPA (unsigned)" → Run workflow, hoặc push
# code trong ios-app/** (tự build + ký). Không dùng App Store.
#
# Kết quả: một TRANG CÀI ĐẶT (install.html trên R2) — link https hiện đúng
# trong job summary, mở bằng Safari rồi bấm nút "Cài Kepto" là iOS hiện
# bảng cài đặt, không cần Feather. Kèm link tải IPA trực tiếp.
# VÌ SAO KHÔNG DÙNG PRESIGNED URL NỮA (v3): GitHub che secret trong job
# summary — access key trong presigned URL thành *** nên chữ ký hỏng, bấm
# vào là lỗi 403; và GitHub cũng lược bỏ link itms-services:// khỏi
# summary nên dòng "bấm để cài" chỉ còn là chữ thường, không bấm được.
# Vì vậy v4 dùng URL public của bucket (không có chữ ký, không secret
# trong link) và đặt nút cài thật vào trong trang HTML.
# v6: install.html tự nhảy sang itms-services bằng JS ngay khi mở trang
# (kiểu Feather dùng cho WKWebView) — bấm badge 1 cái là tới bảng cài,
# không cần bấm thêm; nút Cài vẫn giữ lại phòng khi Safari chặn cú nhảy.
# Trình duyệt vẫn mở lên một nhịp vì link trong summary bắt buộc là https.
# Không dùng redirect 302 sang itms-services: hướng dẫn OTA nói cách đó
# không tin cậy, scheme phải nằm trực tiếp trong href của trang https.
# Hệ quả: ai có link cũng tải được IPA (giống model Signed releases
# public trước đây); file không tự hết hạn sau 7 ngày nữa — muốn xóa thì
# xóa tay trong bucket.
#
# Cần có trong repo Kepto trước khi chạy:
#   signer/certificate/cert.p12
#   signer/certificate/cert.mobileprovision
#   signer/certificate/cert.txt          (mật khẩu .p12, có thể để trống)
# Secret cần có trong repo Kepto (Settings → Secrets → Actions):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   (tạo R2 API token trong Cloudflare dashboard, quyền Object Read & Write
#   trên bucket)
# KHÔNG cần secret R2_PUBLIC_BASE nữa (v7): host public của bucket ghi
# thẳng trong file workflow bên dưới. Lý do: GitHub che mọi giá trị secret
# xuất hiện trong job summary — link chứa secret bị thay bằng *** nên thành
# đường dẫn tương đối, bấm vào là về trang GitHub. Host r2.dev là public
# (ai cũng tải được file) nên ghi thẳng là an toàn. Chỉ cần bật Public URL
# một lần: Cloudflare dashboard → R2 → bucket → Settings → Public URL
# (r2.dev) → Allow Access. Secret R2_PUBLIC_BASE cũ (nếu có) xoá cũng được.

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"

# 1. TỰ ĐỘNG HỦY JOB CŨ: Nếu bạn push 3 lần liên tiếp, GitHub sẽ tự hủy 2 job cũ
# đang xếp hàng, chỉ giữ lại job mới nhất. Tránh việc bạn phải chờ đợi vô ích.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    # (macos-15 là bắt buộc lúc này vì 14 đã chết. Hãy kiên nhẫn chờ, đừng hủy job)
    timeout-minutes: 60 # Tăng lên 60 phút để không bị kill giữa chừng nếu build chậm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 2. CACHE DERIVED DATA: Lưu lại các file build trung gian.
      # Lần build thứ 2 trở đi sẽ nhanh hơn từ 2-4 phút.
      - name: Cache Xcode Build
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build (no code signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project ios-app/Kepto.xcodeproj \
            -scheme Kepto \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products -name 'Kepto.app' -type d | head -n 1)"
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Kepto-unsigned.ipa Payload
          ls -lh Kepto-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kepto-unsigned
          path: Kepto-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # 3. SIGN: ký IPA vừa build bằng cert trong signer/certificate/
      # (cert.p12 + cert.mobileprovision + cert.txt). Không PPQ: bundle id
      # giữ nguyên com.sadboizx.kepto; nếu app không giữ được đúng id đó
      # thì bước này dừng lại và báo lỗi rõ ràng.
      - name: Sign IPA
        run: |
          set -euo pipefail
          python3 -m signer.sign_one --ipa Kepto-unsigned.ipa --out signed
          SIGNED_IPA="$(ls signed/*.ipa | head -n 1)"
          test -n "$SIGNED_IPA"
          echo "SIGNED_IPA=$SIGNED_IPA" >> "$GITHUB_ENV"
          ls -lh "$SIGNED_IPA"

      # 4. UPLOAD R2 + TRANG CÀI ĐẶT: đẩy IPA đã ký + manifest OTA +
      # trang install.html lên R2, dùng URL public của bucket (không
      # presigned). Trang install.html chứa nút Cài Kepto thật (link
      # itms-services trong HTML thường thì iOS xử lý được — chỉ có
      # GitHub summary mới lược nó). aws cli có sẵn trên máy macOS.
      - name: Upload signed IPA to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          TS="$(date +%Y%m%d-%H%M%S)"
          KEY="kepto-signed/Kepto-$TS.ipa"
          MKEY="kepto-signed/Kepto-$TS.plist"
          IKEY="kepto-signed/install-$TS.html"
          # v7: host public ghi THẲNG ở đây, KHÔNG dùng secret R2_PUBLIC_BASE.
          # GitHub che mọi giá trị secret xuất hiện trong job summary — link
          # chứa secret bị thay bằng *** nên thành đường dẫn tương đối, bấm
          # vào là về trang GitHub (đây mới là nguyên nhân thật; chẩn đoán
          # v5 "secret thiếu https://" là SAI — secret vốn đã có https://).
          # Host r2.dev là public nên ghi thẳng trong file workflow là an toàn.
          BASE="https://pub-4c3a18d3984d4ddc9ea95f6106109a4d.r2.dev"
          IPA_URL="$BASE/$KEY"
          MURL="$BASE/$MKEY"
          PAGE_URL="$BASE/$IKEY"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$SIGNED_IPA" "s3://${R2_BUCKET}/${KEY}" --endpoint-url "$ENDPOINT"
          # Manifest OTA: đọc bundle id / version / tên từ Info.plist
          # trong IPA đã ký, nhúng link IPA (public) vào manifest.
          python3 - "$SIGNED_IPA" "$IPA_URL" manifest.plist <<'EOF'
          import plistlib, sys, zipfile
          from signer.ipa import manifest
          ipa_path, ipa_url, out = sys.argv[1], sys.argv[2], sys.argv[3]
          with zipfile.ZipFile(ipa_path) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".app/Info.plist"))
              info = plistlib.loads(zf.read(name))
          bundle_id = str(info.get("CFBundleIdentifier", ""))
          title = str(info.get("CFBundleDisplayName") or info.get("CFBundleName") or "Kepto")
          version = str(info.get("CFBundleShortVersionString", "") or "")
          open(out, "w", encoding="utf-8").write(manifest(ipa_url, bundle_id, version, title))
          print(f"manifest: {bundle_id} {version} {title}")
          EOF
          aws s3 cp manifest.plist "s3://${R2_BUCKET}/${MKEY}" --endpoint-url "$ENDPOINT" --content-type "application/x-plist"
          ENC="$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$MURL")"
          INSTALL="itms-services://?action=download-manifest&url=$ENC"
          # Trang cài đặt: nút bấm thật nằm trong HTML, mở bằng Safari.
          python3 - "$INSTALL" "$IPA_URL" <<'EOF'
          import sys
          install_url, ipa_url = sys.argv[1], sys.argv[2]
          html = f"""<!doctype html>
          <html lang="vi">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Cài Kepto</title>
          <script>window.location.replace("{install_url}");</script>
          </head>
          <body style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;color:#fff;text-align:center;padding:64px 20px">
          <h1 style="font-size:28px;margin:0 0 8px">Kepto</h1>
          <p style="color:#aaa;margin:0 0 32px">Đang mở bảng cài đặt… Nếu không tự mở, bấm nút bên dưới.</p>
          <a href="{install_url}" style="display:inline-block;padding:16px 36px;background:#0a84ff;color:#fff;border-radius:14px;text-decoration:none;font-size:20px;font-weight:600">Cài Kepto</a>
          <p style="margin-top:28px"><a href="{ipa_url}" style="color:#0a84ff">Tải file IPA trực tiếp</a> (mở bằng Feather nếu cần)</p>
          <p style="color:#888;font-size:13px;margin-top:28px">Nếu hiện "Untrusted Developer": Cài đặt → Cài đặt chung → VPN &amp; Quản lý thiết bị → tin cậy chứng chỉ.</p>
          </body>
          </html>
          """
          open("install.html", "w", encoding="utf-8").write(html)
          EOF
          aws s3 cp install.html "s3://${R2_BUCKET}/${IKEY}" --endpoint-url "$ENDPOINT" --content-type "text/html"
          {
            echo "## Signed IPA"
            echo ""
            echo "- [![Cài Kepto](https://img.shields.io/badge/C%C3%A0i_Kepto-0a84ff?style=for-the-badge&logo=apple)]($PAGE_URL)"
            echo "- IPA trực tiếp: $IPA_URL"
            echo "- File: \`$KEY\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SIGNED_URL=$IPA_URL" >> "$GITHUB_ENV"
          echo "INSTALL_URL=$INSTALL" >> "$GITHUB_ENV"
          echo "INSTALL_PAGE_URL=$PAGE_URL" >> "$GITHUB_ENV"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
