name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"

# 1. TỰ ĐỘNG HỦY JOB CŨ: Nếu bạn push 3 lần liên tiếp, GitHub sẽ tự hủy 2 job cũ 
# đang xếp hàng, chỉ giữ lại job mới nhất. Tránh việc bạn phải chờ đợi vô ích.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15 
    # (macos-15 là bắt buộc lúc này vì 14 đã chết. Hãy kiên nhẫn chờ, đừng hủy job)
    timeout-minutes: 60 # Tăng lên 60 phút để không bị kill giữa chừng nếu build chậm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 2. CACHE DERIVED DATA: Lưu lại các file build trung gian.
      # Lần build thứ 2 trở đi sẽ nhanh hơn từ 2-4 phút.
      - name: Cache Xcode Build
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build (no code signing)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project ios-app/Kepto.xcodeproj \
            -scheme Kepto \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products -name 'Kepto.app' -type d | head -n 1)"
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Kepto-unsigned.ipa Payload
          ls -lh Kepto-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kepto-unsigned
          path: Kepto-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
