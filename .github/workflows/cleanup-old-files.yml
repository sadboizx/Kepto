name: Cleanup old Kepto files
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete old files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm ios-app/Kepto/Views/CollectionDetailView.swift ios-app/Kepto/Views/FeedView.swift ios-app/Kepto/Views/SaveView.swift ios-app/Kepto/Views/ItemDetailView.swift
          git rm .github/workflows/cleanup-old-files.yml
          git commit -m "Delete old views replaced by the Photos UI port (CollectionDetailView, FeedView, SaveView, ItemDetailView)"
          git push
